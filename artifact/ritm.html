<title>Ритм</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Компоновка: одноэкранное приложение — прокручиваемые экраны под полупрозрачной шапкой с большим заголовком,
   плавающая стеклянная панель вкладок с круглой кнопкой действий, листы поднимаются снизу. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --bg:#F2F2F7; --bg-elev:#F2F2F7; --desk:#E4E4EA;
  --card:#FFFFFF; --card-elev:#FFFFFF; --seg:#FFFFFF;
  --fg:#08080A; --fg-2:rgba(60,60,67,.64); --fg-3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.22);
  --glass:rgba(250,250,252,.74); --glass-edge:rgba(255,255,255,.7);
  --toast:rgba(28,28,30,.94); --toast-fg:#FFFFFF;
  --accent:#FF2D55; --accent-deep:#E0143C;
  --pink:#FF375F; --red:#FF3B30; --orange:#FF9500; --yellow:#E6A800; --green:#34C759; --mint:#00B8AE;
  --teal:#30A5C7; --blue:#007AFF; --indigo:#5856D6; --purple:#AF52DE;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-elev:#1C1C1E; --desk:#0A0A0C;
    --card:#1C1C1E; --card-elev:#2C2C2E; --seg:#636366;
    --fg:#FFFFFF; --fg-2:rgba(235,235,245,.64); --fg-3:rgba(235,235,245,.28);
    --sep:rgba(120,120,128,.36); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
    --glass:rgba(34,34,37,.72); --glass-edge:rgba(255,255,255,.1);
    --toast:rgba(242,242,247,.96); --toast-fg:#000000;
    --accent:#FF375F; --accent-deep:#D81B45;
    --pink:#FF375F; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --green:#30D158; --mint:#63E6E2;
    --teal:#40C8E0; --blue:#0A84FF; --indigo:#7D7AFF; --purple:#BF5AF2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-elev:#1C1C1E; --desk:#0A0A0C;
  --card:#1C1C1E; --card-elev:#2C2C2E; --seg:#636366;
  --fg:#FFFFFF; --fg-2:rgba(235,235,245,.64); --fg-3:rgba(235,235,245,.28);
  --sep:rgba(120,120,128,.36); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --glass:rgba(34,34,37,.72); --glass-edge:rgba(255,255,255,.1);
  --toast:rgba(242,242,247,.96); --toast-fg:#000000;
  --accent:#FF375F; --accent-deep:#D81B45;
  --pink:#FF375F; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --green:#30D158; --mint:#63E6E2;
  --teal:#40C8E0; --blue:#0A84FF; --indigo:#7D7AFF; --purple:#BF5AF2;
  color-scheme:dark;
}

/* Ритм — стили приложения.
   Токены цвета и шрифта лежат в css/tokens.css (и встраиваются в сборку для claude.ai). */

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 17px/1.35 var(--font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:10px}
.num{font-family:var(--font-round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- каркас ---------- */
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:520px){
  body{background:var(--desk)}
  #app{box-shadow:0 0 0 1px var(--sep),0 30px 80px rgba(0,0,0,.18)}
}
#root{position:absolute;inset:0;transform-origin:50% 0;will-change:transform;background:var(--bg);overflow:hidden}
#views{position:absolute;inset:0}
.view{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));
  scrollbar-width:none;
}
.view::-webkit-scrollbar{display:none}
.view[hidden]{display:none!important}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- навигационная панель и большой заголовок ---------- */
.navbar{
  position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.navbar::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .22s ease;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:.5px solid var(--sep);
}
.navbar .nav-title{position:absolute;left:50%;transform:translate(-50%,6px);font-weight:600;font-size:17px;opacity:0;transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.view.scrolled .navbar::before{opacity:1}
.view.scrolled .navbar .nav-title{opacity:1;transform:translate(-50%,0)}
.nav-side{display:flex;align-items:center;gap:8px;min-width:36px}
.large-title{padding-top:2px;padding-bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.large-title h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.022em}
.eyebrow{font-size:13px;font-weight:600;color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.avatar{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--pink),var(--orange));color:#fff;font-weight:700;font-size:15px;
  transition:transform .12s ease-out;
}
.avatar:active{transform:scale(.92)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--accent);transition:transform .12s ease-out,background .15s}
.icon-btn:active{transform:scale(.9);background:var(--fill-2)}
.icon-btn.plain{background:none}

/* ---------- плавающая панель вкладок ---------- */
#tabbar{
  position:absolute;z-index:30;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;
}
#tabbar::before{content:"";position:absolute;inset:-28px 0 0;z-index:-1;background:linear-gradient(to top,var(--bg) 18%,transparent);pointer-events:none}
.tabs{
  pointer-events:auto;position:relative;flex:1;display:grid;grid-template-columns:repeat(4,1fr);height:62px;padding:4px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  box-shadow:inset 0 0 0 .5px var(--glass-edge),0 8px 28px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.08);
}
.tab-thumb{position:absolute;top:4px;left:4px;height:54px;width:calc((100% - 8px)/4);border-radius:999px;background:var(--fill);will-change:transform}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--fg-2);border-radius:999px;transition:color .2s ease}
.tab svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
.tab.on{color:var(--accent)}
.tab:active svg{transform:scale(.86)}
.fab{
  pointer-events:auto;width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,var(--pink),var(--accent-deep));
  box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .14s ease-out;
}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.fab.open svg{transform:rotate(45deg)}

/* ---------- секции, карточки, списки ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.section-head h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
.section-head .link{font-size:15px;color:var(--accent);font-weight:500}
.caption{font-size:13px;color:var(--fg-2);padding:0 4px;line-height:1.35}
.card{background:var(--card);border-radius:22px;padding:16px;position:relative;overflow:hidden}
.card.tap{transition:transform .14s ease-out}
.card.tap:active{transform:scale(.975)}
.card-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.card-title svg{width:18px;height:18px}
.card-title .chev{margin-left:auto;color:var(--fg-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.row.has-icon + .row.has-icon::before{left:58px}
.row.tap{transition:background .12s}
.row.tap:active{background:var(--fill)}
.row-main{flex:1;min-width:0}
.row-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--fg-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub.wrap,.row-title.wrap{white-space:normal}
.row-val{font-size:17px;color:var(--fg-2);white-space:nowrap}
.row .chev{color:var(--fg-3);flex:none;width:16px;height:16px}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c,var(--accent))}
.ico svg{width:18px;height:18px}
.ico.soft{background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent))}
.ico.lg{width:44px;height:44px;border-radius:13px}
.ico.lg svg{width:24px;height:24px}

/* ---------- кнопки ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;
  font-size:17px;font-weight:600;transition:transform .12s ease-out,opacity .15s,background .15s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:#fff}
.btn.tinted{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.plain{color:var(--accent);min-height:44px;padding:0 8px;font-weight:500}
.btn.danger{color:var(--red)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px;border-radius:999px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--fill);color:var(--fg-2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.c{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pillbtn{height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500;transition:transform .12s ease-out,background .18s,color .18s}
.pillbtn:active{transform:scale(.94)}
.pillbtn.on{background:var(--accent);color:#fff}

/* сегментированный переключатель */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:10px;background:var(--fill)}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--seg);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);will-change:transform}
.seg button{position:relative;height:32px;font-size:14px;font-weight:500;border-radius:8px;transition:color .15s}
.seg button.on{font-weight:600}

/* ---------- кольца и шкалы ---------- */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .track{stroke:color-mix(in srgb,var(--c) 18%,transparent);fill:none}
.ring .bar{stroke:var(--c);fill:none;stroke-linecap:round}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--c,var(--accent));transform-origin:0 50%;transform:scaleX(0);will-change:transform}
.big{font-family:var(--font-round);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:600;color:var(--fg-2);margin-left:3px;letter-spacing:0}
.mid{font-family:var(--font-round);font-size:24px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.mid small{font-size:13px;font-weight:600;color:var(--fg-2);margin-left:2px}
.muted{color:var(--fg-2)}
.sub{font-size:13px;color:var(--fg-2)}
.t15{font-size:15px}

/* герой: калории + БЖУ */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.macros{display:flex;flex-direction:column;gap:12px;min-width:0}
.macro .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.macro .top b{font-size:15px;font-weight:600}
.macro .top span{color:var(--fg-2);font-family:var(--font-round);font-variant-numeric:tabular-nums}

/* плитки трекеров */
.tile{display:flex;flex-direction:column;gap:10px;min-height:128px;text-align:left;width:100%}
.tile .foot{margin-top:auto}
.spark{display:block;width:100%;height:36px}
.water-glass{position:absolute;right:12px;bottom:12px;width:34px;height:48px;border-radius:6px 6px 11px 11px;border:2px solid color-mix(in srgb,var(--blue) 35%,transparent);overflow:hidden}
.water-glass i{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(to top,var(--blue),color-mix(in srgb,var(--blue) 60%,#fff));transform-origin:50% 100%;transform:scaleY(0);will-change:transform}

/* ---------- листы (bottom sheets) ---------- */
#sheets{position:absolute;inset:0;z-index:50;pointer-events:none}
.sheet-wrap{position:absolute;inset:0;pointer-events:auto;overflow:hidden}
.sheet-scrim{position:absolute;inset:0;background:#000;opacity:0;will-change:opacity}
.sheet{
  position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:calc(100% - 10px);
  background:var(--bg-elev);border-radius:30px 30px 0 0;will-change:transform;
  box-shadow:0 -10px 40px rgba(0,0,0,.16);
}
.sheet.large{height:calc(100% - 44px)}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sheet-grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.sheet-grab i{width:38px;height:5px;border-radius:99px;background:var(--fg-3)}
.sheet-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:44px;padding:0 max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));touch-action:none}
.sheet-head .l{justify-self:start}.sheet-head .r{justify-self:end}
.sheet-title{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:4px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-foot{flex:none;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg-elev);border-top:.5px solid var(--sep)}
.sheet .card,.sheet .list{background:var(--card-elev)}
.close-x{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--fg-2);display:grid;place-items:center;transition:transform .12s ease-out}
.close-x:active{transform:scale(.88)}
.close-x svg{width:14px;height:14px}

/* меню действий */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px}
.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 2px;border-radius:16px;font-size:12px;font-weight:500;text-align:center;line-height:1.15;transition:transform .12s ease-out}
.action:active{transform:scale(.92)}
.action .ico{width:54px;height:54px;border-radius:17px}
.action .ico svg{width:26px;height:26px}

/* ---------- формы ---------- */
.field{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;position:relative}
.field + .field::before,.field + .row::before,.row + .field::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.field label{flex:none;font-size:17px;min-width:96px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;outline:0;font-size:17px;text-align:right;padding:8px 0}
.field textarea{text-align:left;resize:none;min-height:88px;line-height:1.35}
.field select{-webkit-appearance:none;appearance:none;text-align-last:right;color:var(--fg-2);padding-right:2px}
.field input[type=date],.field input[type=time]{color:var(--accent);flex:0 1 auto;margin-left:auto}
.field input::placeholder,.field textarea::placeholder{color:var(--fg-3)}
.field .unit{color:var(--fg-2);font-size:15px;flex:none}
.field.col{flex-direction:column;align-items:stretch;gap:2px;padding-top:10px}
.field.col label{font-size:13px;color:var(--fg-2);min-width:0}
.field.col input{text-align:left}
.input-big{width:100%;border:0;outline:0;background:var(--card-elev);border-radius:14px;padding:14px 16px;font-size:17px}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:10px;overflow:hidden}
.stepper button{width:44px;height:34px;font-size:20px;font-weight:500;display:grid;place-items:center;transition:background .12s}
.stepper button:active{background:var(--fill-2)}
.stepper span{width:.5px;height:18px;background:var(--sep)}

/* линейка-пикер */
.ruler-val{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.ruler-read{display:flex;align-items:baseline;justify-content:center;min-width:168px}
.ruler-num{font-size:56px;padding:0 4px;border-radius:14px;color:inherit;cursor:text;transition:background .15s}
.ruler-num:hover{background:var(--fill)}
.ruler-unit{font:600 17px var(--font-round);color:var(--fg-2);margin-left:5px}
.ruler-input{font-size:56px;width:168px;text-align:center;border:0;outline:0;background:var(--fill);border-radius:14px;color:inherit;padding:0}
.ruler-step{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .12s ease-out,background .15s;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ruler-step:active{transform:scale(.88);background:var(--fill-2)}
.ruler-hint{text-align:center;font-size:13px;color:var(--fg-2);margin-top:4px}
.ruler{position:relative;height:74px;-webkit-mask:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent)}
.ruler-scroll{height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;cursor:grab;-webkit-user-select:none;user-select:none;outline-offset:-3px}
.ruler-scroll.grabbing{cursor:grabbing}
.ruler-scroll::-webkit-scrollbar{display:none}
.ruler-track{height:100%;display:flex;align-items:flex-start;padding:0 calc(50% - 5px);width:max-content}
.tick{flex:none;width:10px;height:100%;position:relative}
.tick::before{content:"";position:absolute;left:50%;top:0;width:1.5px;height:16px;margin-left:-.75px;border-radius:2px;background:var(--fg-3)}
.tick.m::before{height:30px;background:var(--fg-2)}
.tick b{position:absolute;top:38px;left:50%;transform:translateX(-50%);font:600 12px var(--font-round);color:var(--fg-2)}
.ruler::after{content:"";position:absolute;left:50%;top:0;width:3px;height:44px;margin-left:-1.5px;border-radius:3px;background:var(--accent);pointer-events:none}

/* выбор из вариантов */
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card-elev);text-align:left;width:100%;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .18s,transform .12s ease-out}
.option:active{transform:scale(.98)}
.option.on{box-shadow:inset 0 0 0 2px var(--accent)}
.option .t{font-size:17px;font-weight:600}
.option .d{font-size:13px;color:var(--fg-2);margin-top:2px;line-height:1.3}
.option .radio{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--fg-3);display:grid;place-items:center;color:#fff;transition:background .18s,box-shadow .18s}
.option.on .radio{background:var(--accent);box-shadow:none}
.option .radio svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .3s cubic-bezier(.2,.9,.3,1.4)}
.option.on .radio svg{opacity:1;transform:none}

/* ---------- онбординг ---------- */
.ob{display:flex;flex-direction:column;height:100%}
.ob-top{flex:none;display:flex;align-items:center;gap:12px;height:52px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.ob-progress{flex:1;height:5px;border-radius:9px;background:var(--fill);overflow:hidden}
.ob-progress i{display:block;height:100%;width:100%;background:var(--accent);border-radius:9px;transform-origin:0 50%;transform:scaleX(0);will-change:transform}
.ob-body{flex:1;min-height:0;overflow-y:auto;padding:8px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.ob-body h1{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.ob-body .lead{font-size:17px;color:var(--fg-2);line-height:1.4;margin-top:-8px}
.ob-foot{flex:none;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.welcome h1{font-size:44px;font-weight:800;letter-spacing:-.035em}
.welcome p{font-size:19px;color:var(--fg-2);line-height:1.35;max-width:300px;text-wrap:balance}
.feature{display:flex;gap:14px;align-items:flex-start;text-align:left}
.feature b{display:block;font-size:16px}
.feature span{font-size:14px;color:var(--fg-2);line-height:1.3}

/* ---------- тосты ---------- */
#toasts{position:absolute;z-index:80;top:8px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 16px 10px 12px;border-radius:999px;font-size:15px;font-weight:600;
  background:var(--toast);color:var(--toast-fg);box-shadow:0 12px 34px rgba(0,0,0,.28);will-change:transform,opacity;
}
.toast .ico{width:26px;height:26px;border-radius:50%}
.toast .ico svg{width:15px;height:15px}

/* ---------- анализы ---------- */
.range{position:relative;height:6px;border-radius:9px;background:var(--fill);margin:14px 0 4px}
.range .ok{position:absolute;top:0;bottom:0;border-radius:9px;background:color-mix(in srgb,var(--green) 55%,transparent)}
.range .dot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c,var(--green));box-shadow:0 0 0 3px var(--card-elev),0 2px 6px rgba(0,0,0,.25);will-change:left}
.marker{padding:14px 16px;position:relative}
.marker + .marker::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.marker .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.marker .name{font-size:16px;font-weight:600;min-width:0}
.marker .val{font-family:var(--font-round);font-weight:700;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.marker .val small{font-size:12px;font-weight:600;color:var(--fg-2);margin-left:3px}
.marker .ref{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2)}
.note{border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.42;background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--card-elev))}
.note b.h{display:flex;align-items:center;gap:6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--c,var(--accent));margin-bottom:6px}
.note b.h svg{width:15px;height:15px}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:3px 0}
.disclaimer{font-size:12px;line-height:1.35;color:var(--fg-2);text-align:center;padding:4px 12px}

/* ---------- ИИ: состояние ожидания ---------- */
.ai-wait{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 12px;text-align:center}
.ai-orb{width:76px;height:76px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,var(--pink),var(--orange),var(--purple),var(--blue),var(--pink));animation:spin 2.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 54%,#000 56%);mask:radial-gradient(circle,transparent 54%,#000 56%)}
@keyframes spin{to{transform:rotate(360deg)}}
.shimmer{background:linear-gradient(100deg,var(--fill) 20%,var(--fill-2) 40%,var(--fill) 60%);background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}
.demo-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange);text-transform:uppercase;letter-spacing:.04em}

/* ---------- питание ---------- */
.meal-head{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.meal-head b{font-size:17px}
.meal-head .kc{margin-left:auto;font-family:var(--font-round);font-weight:600;color:var(--fg-2);font-size:15px}
.food-row{display:flex;align-items:center;gap:10px;padding:9px 16px;position:relative}
.food-row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.food-row .n{flex:1;min-width:0}
.food-row .n b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-row .n span{font-size:12.5px;color:var(--fg-2)}
.food-row .k{font-family:var(--font-round);font-weight:600;font-size:15px;white-space:nowrap}
.add-line{display:flex;align-items:center;gap:8px;padding:11px 16px;color:var(--accent);font-weight:500;font-size:16px;width:100%;position:relative}
.add-line::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.add-line svg{width:18px;height:18px}
.daytabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:none;min-width:52px;padding:8px 10px;border-radius:14px;background:var(--card);text-align:center;font-size:12px;font-weight:600;color:var(--fg-2);transition:transform .12s ease-out,background .2s,color .2s}
.daytab b{display:block;font:700 18px var(--font-round);color:var(--fg);margin-top:1px}
.daytab.on{background:var(--accent);color:rgba(255,255,255,.85)}
.daytab.on b{color:#fff}
.daytab:active{transform:scale(.93)}
.recipe-steps{margin:0;padding-left:20px;font-size:15px;line-height:1.45}
.recipe-steps li{margin:6px 0}
.nutri-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutri{background:var(--card-elev);border-radius:14px;padding:10px 6px;text-align:center}
.nutri b{display:block;font:700 19px var(--font-round)}
.nutri span{font-size:11.5px;color:var(--fg-2)}
.grade{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 22px var(--font-round);color:#fff;background:var(--c,var(--fg-3));flex:none}

/* сканер */
.scanner{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;width:100%}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;left:12%;right:12%;top:34%;height:30%;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none}
.scan-frame::before{content:"";position:absolute;inset:-2px;border-radius:20px;border:3px solid #fff;-webkit-mask:conic-gradient(#000 0 0) top left/26px 26px no-repeat,conic-gradient(#000 0 0) top right/26px 26px no-repeat,conic-gradient(#000 0 0) bottom left/26px 26px no-repeat,conic-gradient(#000 0 0) bottom right/26px 26px no-repeat;mask:conic-gradient(#000 0 0) top left/26px 26px no-repeat,conic-gradient(#000 0 0) top right/26px 26px no-repeat,conic-gradient(#000 0 0) bottom left/26px 26px no-repeat,conic-gradient(#000 0 0) bottom right/26px 26px no-repeat}
.scan-line{position:absolute;left:6%;right:6%;top:0;height:2px;border-radius:2px;background:var(--pink);box-shadow:0 0 14px 2px var(--pink);animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:92%}}
.scan-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:14px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* ---------- тренировки ---------- */
.ex{display:flex;gap:12px;align-items:center;padding:12px 16px;position:relative}
.ex + .ex::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.ex .n{flex:1;min-width:0}
.ex .n b{display:block;font-size:16px;font-weight:600}
.ex .n span{font-size:13px;color:var(--fg-2)}
.sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:132px}
.set{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--fg-3);display:grid;place-items:center;font:700 12px var(--font-round);color:var(--fg-2);transition:transform .25s cubic-bezier(.2,.9,.3,1.5),background .18s,box-shadow .18s,color .18s}
.set.on{background:var(--green);box-shadow:none;color:#fff;transform:scale(1.06)}
.set:active{transform:scale(.86)}
.timer-pill{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:999px;background:var(--toast);color:var(--toast-fg);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:11px;font-weight:600;color:var(--fg-2)}
.week .o{width:30px;height:30px;margin:5px auto 0;border-radius:50%;display:grid;place-items:center;background:var(--fill);font:600 13px var(--font-round);color:var(--fg-2)}
.week .o.done{background:var(--green);color:#fff}
.week .o.plan{box-shadow:inset 0 0 0 2px var(--accent);background:none;color:var(--accent)}
.week .o.today{outline:2px solid var(--fg);outline-offset:2px}

/* ---------- пустые состояния ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px}
.empty .ico{width:60px;height:60px;border-radius:19px}
.empty .ico svg{width:30px;height:30px}
.empty b{font-size:19px}
.empty p{font-size:15px;color:var(--fg-2);line-height:1.35;max-width:300px}

/* графики */
.chart{display:block;width:100%;height:150px}
.chart text{font:600 10.5px var(--font-round);fill:var(--fg-2)}
.chart .grid{stroke:var(--sep);stroke-width:1}

/* появление элементов */
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:.001;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.view.no-anim .rise{animation:none}

@media (prefers-reduced-motion:reduce){
  .rise,.pop,.fade{animation:fade .2s ease both}
  .ai-orb,.shimmer,.scan-line{animation:none}
  *{scroll-behavior:auto!important}
}
@media (prefers-reduced-transparency:reduce){
  .tabs,.navbar::before{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}
}
@media (prefers-contrast:more){
  .card,.list,.option{box-shadow:inset 0 0 0 1px var(--fg-2)}
}

/* ---------- тренер ---------- */
.coach-svg{display:block;width:100%;height:100%;overflow:visible;color:var(--fg)}
.coach-svg .cskin{fill:var(--c-skin)}
.coach-svg .ctop{fill:var(--c-top)}
.coach-svg .cbot{fill:var(--c-bot)}
.coach-svg .cshoe{fill:var(--c-shoe)}
.coach-svg .chair{fill:var(--c-hair)}
.coach-svg .csole{fill:#2C2C2E}
.coach-svg .ceye{fill:#1C1C1E}
.coach-svg .chl{fill:var(--accent);opacity:.55;mix-blend-mode:normal}
.coach-svg .cfar{filter:brightness(.72) saturate(.9)}
.coach-svg .cfar .chl{opacity:.3}
.coach-svg .cfl{stroke:var(--sep);stroke-width:1.5}
.coach-svg .cpad{stroke:var(--coach-gear);stroke-width:7;stroke-linecap:round}
.coach-svg .cleg{stroke:var(--coach-gear);stroke-width:3.5;stroke-linecap:round}
.coach-svg .cbox{fill:var(--coach-gear)}
.coach-svg .cpul{fill:var(--card);stroke:var(--coach-gear);stroke-width:2.5}
.coach-svg .ccab{stroke:var(--fg-3);stroke-width:1.6}
.coach-svg .cdb{fill:#3A3A3C}
.coach-svg .cplate{fill:var(--card);stroke:#3A3A3C;stroke-width:4}
:root{--coach-gear:color-mix(in srgb,var(--fg) 16%,var(--bg));--c-skin:#E3AE8D;--c-top:#3B3F4A;--c-bot:#1F2229;--c-shoe:#D5D9E2;--c-hair:#3A2A22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-top:#5B6170;--c-bot:#3A3F4A;--c-shoe:#E5E5EA;--c-hair:#2A1E18}}
:root[data-theme="dark"]{--c-top:#5B6170;--c-bot:#3A3F4A;--c-shoe:#E5E5EA;--c-hair:#2A1E18}
.coach-thumb{width:64px;height:52px;flex:none;border-radius:13px;background:var(--fill);padding:2px;transition:transform .12s ease-out}
.coach-thumb:active{transform:scale(.92)}
.coach-stage{position:relative;aspect-ratio:240/190;width:100%;max-width:100%;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 15%,color-mix(in srgb,var(--accent) 9%,var(--card-elev)),var(--card-elev) 70%)}
.coach-stage .coach-svg{padding:6px 10px 2px}
.coach-phase{position:absolute;left:12px;top:12px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:opacity .2s}
.coach-ctrl{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.coach-ctrl button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--fg);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.coach-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.coach-steps li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4;counter-increment:st}
.coach-steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font:700 13px var(--font-round)}

/* ---------- проверка техники камерой ---------- */
.pc-stage{position:relative;height:100%;min-height:100%;background:#000;overflow:hidden;color:#fff}
.pc-video,.pc-canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc-video.mirror,.pc-canvas.mirror{transform:scaleX(-1)}
.pc-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.pc-count{padding:8px 16px 10px;border-radius:20px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pc-reps{font:800 46px/1 var(--font-round)}
.pc-reps.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.35)}
.pc-reps-l{font-size:12px;opacity:.8;margin-top:2px}
.pc-tools{display:flex;gap:8px}
.pc-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pc-btn.off{opacity:.45}
.pc-mini{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:120px;height:96px;
  border-radius:18px;background:rgba(255,255,255,.88);padding:4px}
.pc-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.7))}
.pc-name{font-size:13px;opacity:.75;margin-bottom:6px}
.pc-msg{display:inline-block;padding:10px 16px;border-radius:16px;font-size:17px;font-weight:600;line-height:1.3;background:rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background .25s}
.pc-msg.good{background:color-mix(in srgb,#30D158 75%,transparent)}
.pc-msg.warn{background:color-mix(in srgb,#FF9F0A 82%,transparent);color:#1C1C1E}
.pc-msg.bad{background:color-mix(in srgb,#FF453A 80%,transparent)}
/* своя камера для снимков */
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.row{cursor:pointer;position:relative}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cam-msgline{min-height:20px;text-align:center}
.cam-bar{position:relative;width:100%;height:84px;display:flex;align-items:center;justify-content:center}
.cam-shutter{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 0 8px #fff;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.35),opacity .2s}
.cam-shutter:active{transform:scale(.88)}
.cam-shutter:disabled{opacity:.35}
.cam-thumbs{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;max-width:calc(50% - 50px);overflow:hidden}
.cam-thumbs img{flex:none;width:48px;height:48px;border-radius:10px;object-fit:cover;border:2px solid #fff;margin-right:-26px;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.2,.9,.3,1.35)}
.cam-done{position:absolute;right:0;top:50%;transform:translateY(-50%);padding:12px 18px;border-radius:22px;background:#FFD60A;color:#1C1C1E;font-weight:700;font-size:16px}
.cam-native{position:relative;font-size:14px;color:rgba(255,255,255,.75);text-decoration:underline;cursor:pointer;padding:4px 8px}
.cam-native.big{font-size:17px;color:#1C1C1E;text-decoration:none;background:#fff;padding:12px 20px;border-radius:22px;font-weight:700}
.cam-flash{animation:camflash .18s ease-out}
@keyframes camflash{0%{filter:brightness(2.4)}100%{filter:none}}

/* ---------- пульс с часов ---------- */
.hr-chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;margin-left:6px;border-radius:999px;background:var(--fill);color:var(--fg-2);font-size:14px;font-weight:600}
.hr-chip.on{color:var(--fg);--z:var(--red)}
.hr-chip .hr-heart{display:grid;place-items:center;color:var(--fg-3)}
.hr-chip.on .hr-heart{color:var(--z,var(--red));animation:beat 1s ease-in-out infinite}
.hr-chip.dark{background:rgba(255,255,255,.16);color:#fff;margin:8px 0 0}
.hr-big{font:800 64px/1 var(--font-round);transition:color .3s}
.big-h{color:var(--red);animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.hr-chip.on .hr-heart,.big-h{animation:none}}

/* ---------- данные с часов ---------- */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wstat{display:flex;gap:10px;align-items:center;min-width:0}
.wstat b{display:block;font-size:19px;font-weight:700}
.wstat b small{font-size:12px;color:var(--fg-2);font-weight:600}
.wstat span:not(.ico){font-size:12px;color:var(--fg-2)}

/* видео холодильника */
.scan-rec{width:76px;height:76px;border-radius:50%;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 0 8px #fff;display:grid;place-items:center;background:transparent;cursor:pointer;transition:transform .2s}
.scan-rec i{display:block;width:60px;height:60px;border-radius:50%;background:#FF3B30;transition:width .3s cubic-bezier(.2,.9,.3,1.2),height .3s cubic-bezier(.2,.9,.3,1.2),border-radius .3s}
.scan-rec.on i{width:28px;height:28px;border-radius:7px}
.scan-rec:active{transform:scale(.9)}
.scan-rec:disabled{opacity:.35}
.scan-time{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:8px;background:#FF3B30;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.scan-status{margin-top:4px;font-size:13px;color:rgba(255,255,255,.85)}
.scan-found{position:absolute;left:12px;right:12px;bottom:calc(200px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap-reverse;gap:6px;max-height:32%;overflow:hidden;align-content:flex-start}
.scan-chip{padding:6px 11px;border-radius:999px;background:rgba(48,209,88,.85);color:#fff;font-size:14px;font-weight:600;animation:pop .35s cubic-bezier(.2,.9,.3,1.35)}
.scan-chip.ice{background:rgba(100,210,255,.85);color:#06283D}
.scan-subs{position:absolute;left:16px;right:16px;bottom:calc(160px + env(safe-area-inset-bottom));text-align:center;font-size:16px;line-height:1.3;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.scan-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scan-strip img{flex:none;width:72px;height:96px;object-fit:cover;border-radius:10px}
.scan-said summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px}
.scan-said p{margin:8px 0 0;color:var(--fg-2);font-size:15px;line-height:1.4}
textarea.input-big{resize:vertical;min-height:84px;font:inherit;line-height:1.35}

/* Ритм — расчёты: обмен веществ, калории, БЖУ, нормы. */
(function () {
  'use strict';
  const App = window.App;

  const ACTIVITY = [
    { id: 1.2, t: 'Сидячий образ жизни', d: 'Работа за столом, мало ходьбы' },
    { id: 1.375, t: 'Лёгкая активность', d: 'Прогулки или 1–3 тренировки в неделю' },
    { id: 1.55, t: 'Умеренная активность', d: '3–5 тренировок в неделю' },
    { id: 1.725, t: 'Высокая активность', d: 'Интенсивные тренировки 6–7 раз в неделю' },
    { id: 1.9, t: 'Очень высокая', d: 'Физическая работа и спорт каждый день' }
  ];
  const GOALS = [
    { id: 'lose', t: 'Похудеть', d: 'Дефицит калорий, больше белка, чтобы сохранить мышцы', icon: 'down', c: 'var(--blue)' },
    { id: 'keep', t: 'Поддерживать вес', d: 'Баланс калорий и сбалансированные БЖУ', icon: 'target', c: 'var(--green)' },
    { id: 'gain', t: 'Набрать массу', d: 'Умеренный профицит и силовые тренировки', icon: 'up', c: 'var(--orange)' }
  ];

  const age = (p) => new Date().getFullYear() - p.birthYear;
  // Миффлин — Сан Жеор
  const bmr = (p) => 10 * p.weight + 6.25 * p.height - 5 * age(p) + (p.sex === 'm' ? 5 : -161);
  const tdee = (p) => bmr(p) * (p.activity || 1.375);
  const bmi = (p) => { const m = p.height / 100; return p.weight / (m * m); };
  const bmiInfo = (v) => v < 18.5 ? { t: 'Ниже нормы', c: 'var(--blue)' } : v < 25 ? { t: 'Норма', c: 'var(--green)' } : v < 30 ? { t: 'Выше нормы', c: 'var(--orange)' } : { t: 'Ожирение', c: 'var(--red)' };

  function targets(p) {
    const B = bmr(p), T = tdee(p), pace = p.pace || 0.5;
    let delta = 0, guard = null;
    // защита: подросткам и людям с дефицитом массы тела дефицит калорий не назначаем
    if (p.goal === 'lose' && age(p) < 18) guard = 'minor';
    else if (p.goal === 'lose' && bmi(p) < 18.5) guard = 'underweight';
    if (p.goal === 'lose' && !guard) delta = -Math.min((pace * 7700) / 7, T * 0.25);
    if (p.goal === 'gain') delta = Math.min((pace * 7700) / 7, T * 0.2);
    let kcal = T + delta, limited = false;
    const floor = p.sex === 'm' ? 1500 : 1200;   // ниже — только под наблюдением врача
    if (kcal < floor) { kcal = floor; limited = true; }
    kcal = Math.round(kcal / 10) * 10;
    // при ИМТ > 30 считаем белок и жир от «скорректированного» веса
    const m = p.height / 100, ref = bmi(p) > 30 ? 27 * m * m : p.weight;
    const pk = p.goal === 'keep' ? 1.4 : 1.8;
    let fk = p.goal === 'lose' ? 0.8 : p.goal === 'gain' ? 1.0 : 0.9;
    let prot = Math.round(pk * ref);
    let fat = Math.round(App.clamp(fk * ref, (kcal * 0.2) / 9, (kcal * 0.35) / 9));
    let carb = Math.round((kcal - prot * 4 - fat * 9) / 4);
    if (carb < 90) { fat = Math.round(Math.max(0.6 * ref, (kcal * 0.2) / 9)); carb = Math.round((kcal - prot * 4 - fat * 9) / 4); }
    if (carb < 50) { carb = 50; prot = Math.max(60, Math.round((kcal - fat * 9 - carb * 4) / 4)); }
    return {
      kcal: kcal, p: prot, f: fat, c: carb,
      water: App.clamp(Math.round((p.weight * 30) / 50) * 50, 1500, 3500),
      steps: p.goal === 'lose' ? 10000 : 8000, sleep: 8,
      bmr: Math.round(B), tdee: Math.round(T), delta: Math.round(kcal - T), limited: limited, guard: guard
    };
  }
  // реальный темп, кг/нед, и срок до цели
  function forecast(p, t) {
    if (!p.targetWeight || p.goal === 'keep') return null;
    const rate = Math.abs(t.delta) * 7 / 7700;
    const diff = Math.abs(p.weight - p.targetWeight);
    if (rate < 0.05 || diff < 0.1) return null;
    const weeks = Math.ceil(diff / rate), d = new Date(); d.setDate(d.getDate() + weeks * 7);
    return { rate: rate, weeks: weeks, date: d };
  }
  function sumFood(list) {
    const s = { kcal: 0, p: 0, f: 0, c: 0 };
    (list || []).forEach((x) => { s.kcal += +x.kcal || 0; s.p += +x.p || 0; s.f += +x.f || 0; s.c += +x.c || 0; });
    return s;
  }
  // пересчёт продукта «на 100 г» в порцию
  const portion = (per100, grams) => ({
    kcal: Math.round(((per100.kcal || 0) * grams) / 100), p: +(((per100.p || 0) * grams) / 100).toFixed(1),
    f: +(((per100.f || 0) * grams) / 100).toFixed(1), c: +(((per100.c || 0) * grams) / 100).toFixed(1)
  });

  // оценка давления (ориентиры ESC/ESH), пульса, сахара
  function bpInfo(sys, dia) {
    if (sys < 90 || dia < 60) return { t: 'Пониженное', c: 'var(--blue)' };
    if (sys < 120 && dia < 80) return { t: 'Оптимальное', c: 'var(--green)' };
    if (sys < 130 && dia < 85) return { t: 'Нормальное', c: 'var(--green)' };
    if (sys < 140 && dia < 90) return { t: 'Высокое нормальное', c: 'var(--yellow)' };
    if (sys < 160 && dia < 100) return { t: 'Повышенное', c: 'var(--orange)' };
    return { t: 'Высокое', c: 'var(--red)' };
  }
  const pulseInfo = (v) => v < 50 ? { t: 'Низкий', c: 'var(--blue)' } : v <= 90 ? { t: 'В норме', c: 'var(--green)' } : v <= 100 ? { t: 'Учащённый', c: 'var(--orange)' } : { t: 'Высокий', c: 'var(--red)' };
  function sugarInfo(v, fasting) {
    if (v < 3.9) return { t: 'Низкий', c: 'var(--blue)' };
    if (fasting ? v <= 5.5 : v <= 7.8) return { t: 'В норме', c: 'var(--green)' };
    if (fasting ? v < 7.0 : v < 11.1) return { t: 'Повышен', c: 'var(--orange)' };
    return { t: 'Высокий', c: 'var(--red)' };
  }

  App.calc = { ACTIVITY, GOALS, age, bmr, tdee, bmi, bmiInfo, targets, forecast, sumFood, portion, bpInfo, pulseInfo, sugarInfo };
})();

    const k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.86).split(',')[1];
  }
  const fileB64 = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });

  /* ---------- сервер приложения ---------- */
  const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
  async function serverError(res) {
    let code = '';
    try { const j = await res.json(); code = (j && j.error && j.error.code) || ''; } catch (e) {}
    return fail(ERR[code] || GENERIC, code || 'server');
  }
  // пропуск устройства: выдаётся сервером один раз и хранится на устройстве
  async function enroll(signal) {
    let res;
    try { res = await fetch(SERVER + '/enroll', { method: 'POST', signal: signal }); } catch (e) { throw fail(ERR.network, 'network'); }
    if (!res.ok) throw await serverError(res);
    const j = await res.json();
    if (!j || !j.token) throw fail(GENERIC, 'server');
    try { localStorage.setItem(TOKEN_KEY, j.token); } catch (e) {}
    return j.token;
  }
  // читаем поток ответа Claude (server-sent events) и собираем текст
  async function readStream(res) {
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', stop = null, err = null;
    for (;;) {
      const part = await reader.read();
      if (part.done) break;
      buf += dec.decode(part.value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (line.indexOf('data:') !== 0) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') text += ev.delta.text;
        else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
        else if (ev.type === 'error') err = ev.error || {};
      }
    }
    return { text: text, stop: stop, err: err };
  }
  async function viaServer(kind, prompt, o) {
    const content = [];
    for (const f of o.files || []) {
      if (f.type === 'application/pdf') content.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: await fileB64(f) } });
      else content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await toJpegB64(f) } });
    }
    content.push({ type: 'text', text: prompt });
    const body = JSON.stringify(content);
    const send = async (token) => {
      try { return await fetch(SERVER + '/ask', { method: 'POST', headers: { 'authorization': 'Bearer ' + token, 'content-type': 'application/json', 'x-ritm-kind': kind }, body: body, signal: o.signal }); }
      catch (e) { throw fail(o.signal && o.signal.aborted ? ERR.cancelled : ERR.network, o.signal && o.signal.aborted ? 'cancelled' : 'network'); }
    };
    let res = await send(getToken() || (await enroll(o.signal)));
    if (res.status === 401) res = await send(await enroll(o.signal));   // пропуск устарел (например, сменился ключ на сервере) — получаем новый
    if (!res.ok) throw await serverError(res);
    let out;
    try { out = await readStream(res); } catch (e) { throw fail(ERR.network, 'network'); }
    if (out.err) throw fail(out.err.type === 'overloaded_error' ? ERR.overloaded : GENERIC, 'stream');
    if (out.stop === 'refusal') throw fail(ERR.refused, 'refused');
    if (out.stop === 'max_tokens') throw fail(ERR.truncated, 'truncated');
    return parseJSON(out.text);
  }
  // проверка связи с сервером для экрана настроек
  async function serverStatus() {
    if (!SERVER) return { ok: false, reason: 'none' };
    try {
      const res = await fetch(SERVER + '/', { cache: 'no-store' }), j = await res.json();
      return { ok: !!(j && j.ok && j.configured), configured: !!(j && j.configured), enroll: !!(j && j.enroll), device: !!getToken() };
    } catch (e) { return { ok: false, reason: 'network' }; }
  }

  /* ---------- встроенный Claude на claude.ai ---------- */
  async function viaSample(prompt, o) {
    const opts = { cache: false, modelTier: o.tier || 'default' };
    if (o.signal) opts.signal = o.signal;
    if (o.files && o.files.length) {
      if (!imgLimits) throw fail(ERR.images_unavailable, 'images_unavailable');
      if (o.files.some((f) => f.type === 'application/pdf')) throw fail('PDF здесь не читается. Сделайте снимок экрана или фото бланка.', 'pdf');
      opts.images = o.files.slice(0, imgLimits.maxCount || 4);
    }
    try { return await sample.json(prompt, opts); }
    catch (e) { throw fail(ERR[e && e.code] || GENERIC, e && e.code); }
  }

  // главный вызов: вернёт { data, demo }
  async function ask(kind, prompt, o) {
    o = o || {};
    await Promise.race([Promise.all([boot, serverBoot]), delay(o.files ? 11000 : 3000)]);
    const m = mode();
    if (m === 'claude') return { data: await viaSample(prompt, o), demo: false };
    if (m === 'server') {
      try { return { data: await viaServer(kind, prompt, o), demo: false }; }
      catch (e) { if (e.code !== 'not_configured') throw e; serverOk = false; }   // ключа на сервере нет — ниже покажем пример
    }
    await delay(1300);

/* Ритм — холодильник по видео: съёмка с рассказом голосом, разбор по кадрам (на ходу или после), запасы и что приготовить.
   Видео в ИИ целиком не отправляется: из него берутся несхожие кадры, а речь — текстом. */
(function () {
  'use strict';
  const App = window.App, { h, icon, store, sheet, toast, haptic, nf, uid } = App;

  /* ---------- кадры ---------- */
  // «отпечаток» кадра 32×24 в оттенках серого — чтобы не брать одинаковые кадры
  const sigCanvas = document.createElement('canvas'); sigCanvas.width = 32; sigCanvas.height = 24;
  function sig(src) {
    const g = sigCanvas.getContext('2d', { willReadFrequently: true });
    g.drawImage(src, 0, 0, 32, 24);

    for (let i = 0; i < 768; i++) out[i] = (d[i * 4] * 3 + d[i * 4 + 1] * 6 + d[i * 4 + 2]) / 10;

    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);

  });
  // равномерно оставить n штук
  const thin = (arr, n) => (arr.length <= n ? arr : Array.from({ length: n }, (_, i) => arr[Math.round(i * (arr.length - 1) / (n - 1 || 1))]));

  // кадры из готового видеофайла
  async function framesFromFile(file, want, onProg) {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    const wait = (ev, ms) => new Promise((res, rej) => {
      const t = setTimeout(() => { off(); rej(new Error('timeout')); }, ms);
      const ok = () => { off(); res(); }, bad = () => { off(); rej(new Error('decode')); };
      const off = () => { clearTimeout(t); v.removeEventListener(ev, ok); v.removeEventListener('error', bad); };
      v.addEventListener(ev, ok); v.addEventListener('error', bad);

      let dur = v.duration;
      if (!isFinite(dur) || !dur) { const sk = wait('seeked', 8000); v.currentTime = 1e7; await sk.catch(() => {}); dur = isFinite(v.duration) && v.duration ? v.duration : v.currentTime; }

      setMsgFn = (t, kind) => { msg.textContent = t; msg.className = 'pc-msg ' + (kind || ''); msg.hidden = !t; };
      const showFound = (got) => got.forEach((x) => found.appendChild(h('span', { class: 'scan-chip' + (x.zone === 'freezer' ? ' ice' : '') }, x.name)));
      const setStatus = () => { status.hidden = !busy && !pending.length; status.textContent = busy ? 'ИИ смотрит кадры…' : pending.length ? 'Кадров в очереди: ' + pending.length : ''; };
      // отправляем накопившиеся кадры, пока снимаем
      pump = async (force) => {
        if (busy || fails >= 3 || !pending.length || (!force && pending.length < B)) return;
        busy = true; setStatus();
        const part = pending.splice(0, B);
        try { const got = await analyze(scan, part); showFound(got); fails = 0; if (got.length) haptic(8); }
        catch (e) { pending.unshift(...part); fails++; if (e.code === 'not_granted' || fails >= 3) setMsg('Разберу после съёмки', 'warn'); }
        busy = false; setStatus();
        if (recording || force) pump(force);
      };
      const sample = () => {
        if (!video.videoWidth || kept >= 40) return;
        const sg = sig(video), now = Date.now(), d = lastSig ? dist(sg, lastSig) : 99;
        if (d > 12 || (now - lastT > 4000 && d > 4)) {
          lastSig = sg; lastT = now; kept++;
          grab(video).then((f) => { if (!f) return; pending.push(f); setStatus(); pump(false); });
        }
      };
      begin = () => {
        recording = true; t0 = Date.now(); haptic(15); rec.classList.add('on'); rec.setAttribute('aria-label', 'Закончить съёмку');
        time.hidden = false; setMsg(sr ? 'Ведите камерой медленно и говорите, что где лежит' : 'Ведите камерой медленно. Голос здесь не распознаётся — после съёмки можно дописать', '');
        if (sr) sr.start();
        timer = setInterval(sample, 600); sample();
        tick = setInterval(() => { const sec = Math.round((Date.now() - t0) / 1000); time.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); if (sec >= 180) finish(); }, 500);
      };
      finish = async () => {
        if (!recording) return;
        stopAll(); haptic(15); rec.disabled = true; rec.classList.remove('on');
        if (!kept && !scan.speech) { setMsg('Ничего не снято', 'warn'); rec.disabled = false; return; }
        setMsg('Досматриваю последние кадры…', '');
        const waitBusy = () => new Promise((r) => { const iv = setInterval(() => { if (!busy) { clearInterval(iv); r(); } }, 150); });
        await waitBusy(); fails = 0; await pump(true); await waitBusy();
        done = true; s.close(); setTimeout(() => result(scan, pending.slice()), 160);
      };
      (async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
          if (done) return stopAll();
          video.srcObject = stream; await video.play().catch(() => {});
          rec.disabled = false; setMsg('Нажмите кнопку и начинайте с верхней полки', '');
        } catch (er) {
          setMsg('Камера не запустилась. Разрешите доступ к камере или снимите видео камерой телефона.', 'bad');
          msg.parentNode.appendChild(h('button', { class: 'cam-native big', type: 'button', onclick: () => ui.openInput({ accept: 'video/*', onFiles: (f) => videoFile(f[0]) }, true, () => { done = true; stopAll(); s.close(); }) }, 'Открыть камеру телефона'));
        }
      })();
    } });
  }

/* Ритм — тренер: анимированный персонаж показывает технику упражнений.
   Персонаж и все позы нарисованы с нуля: скелет из 2D-суставов, позы задаются углами, движение — интерполяция
   между ключевыми позами с плавным замедлением. Углы: dir(a) = (sin a, cos a), ось y вниз:
   0 — вниз, 90 — вперёд (персонаж смотрит вправо), 180 — вверх, 270 — назад. */
(function () {

  const rad = Math.PI / 180;
  const dir = (a) => [Math.sin(a * rad), Math.cos(a * rad)];
  const add = (p, a, len) => { const d = dir(a); return [p[0] + d[0] * len, p[1] + d[1] * len]; };
  const lerpA = (a, b, k) => a + ((((b - a) % 360) + 540) % 360 - 180) * k;   // кратчайший путь по углу
  const ease = (k) => 0.5 - Math.cos(Math.PI * k) / 2;

  /* ---------- позы ---------- */
  const S0 = { T: 180, ua: 4, fa: 8, t: 0, s: 0 };
  const P = (o) => Object.assign({}, S0, o);
  const ANIMS = {
    squat: { focus: ['TH', 'SH'], labels: ['Исходное положение', 'Таз назад и вниз'],
      kf: [P({ ua: 6, fa: 6 }), P({ T: 140, ua: 92, fa: 90, t: 84, s: -24 })] },
    squat_bar: { focus: ['TH', 'SH'], props: ['barback'], labels: ['Штанга на трапециях', 'Присед до параллели'],
      kf: [P({ T: 178, ua: 330, fa: 150 }), P({ T: 142, ua: 295, fa: 115, t: 84, s: -24 })] },
    lunge: { focus: ['TH', 'SH'], labels: ['Ноги вместе', 'Шаг назад, колено к полу'],
      kf: [P({}), P({ t: 76, s: 2, t2: 345, s2: 273, f2: 15 })] },
    bridge: { focus: ['T', 'TH'], anchor: 'an', labels: ['Лёжа, стопы у таза', 'Таз вверх, сожмите ягодицы'],

  const DEF = ['T', 'H', 'ua', 'fa', 'ua2', 'fa2', 't', 's', 't2', 's2', 'f', 'f2', 'lift'];
  function norm(p) {
    const q = Object.assign({ f: 90, lift: 0 }, p);
    if (q.H == null) q.H = q.T;
    ['ua', 'fa', 't', 's', 'f'].forEach((k) => { if (q[k + '2'] == null) q[k + '2'] = q[k]; });
    return q;
  }
  function fk(p, front) {
    const hip = [0, 0], sh = add(hip, p.T, L.T), head = add(sh, p.H, L.NK);
    const mir = (a) => (front ? 360 - a : a);
    const sh1 = front ? [sh[0] + 13, sh[1]] : sh, sh2 = front ? [sh[0] - 13, sh[1]] : sh;
    const hp1 = front ? [7, 0] : hip, hp2 = front ? [-7, 0] : hip;
    const el = add(sh1, p.ua, L.UA), ha = add(el, p.fa, L.FA);
    const el2 = add(sh2, mir(p.ua2), L.UA), ha2 = add(el2, mir(p.fa2), L.FA);
    const kn = add(hp1, p.t, L.TH), an = add(kn, p.s, L.SH), to = add(an, p.f, front ? 4 : L.FT);
    const kn2 = add(hp2, mir(p.t2), L.TH), an2 = add(kn2, mir(p.s2), L.SH), to2 = add(an2, mir(p.f2), front ? 4 : L.FT);
    return { hip, sh, head, sh1, sh2, hp1, hp2, el, ha, el2, ha2, kn, an, to, kn2, an2, to2 };
  }
  const BOTTOM = [['hip', 'hip'], ['sh', 'sh'], ['head', 'head'], ['el', 'el'], ['ha', 'ha'], ['el2', 'el'], ['ha2', 'ha'], ['kn', 'kn'], ['an', 'an'], ['to', 'to'], ['kn2', 'kn'], ['an2', 'an'], ['to2', 'to']];
  const lowest = (J) => { let m = -1e9; for (const b of BOTTOM) m = Math.max(m, J[b[0]][1] + PAD[b[1]]); return m; };

  // подготовка анимации: позы с умолчаниями, положение корня по опорной точке, центрирование
  const cache = {};
  function prep(id) {
    if (cache[id]) return cache[id];
    const a = ANIMS[id] || ANIMS.march, fy = a.fy || FLOOR;
    let prevW = null;
    const kf = a.kf.map((raw) => {
      const p = norm(raw), J = fk(p, a.front), anc = raw.anchor || a.anchor || 'an';
      const dy = fy - lowest(J);
      let rootX = 0;
      if (raw.keep && prevW) rootX = prevW[anc][0] - J[anc][0];
      const W = {}; for (const k in J) W[k] = [J[k][0] + rootX, J[k][1] + dy];
      prevW = W;
      return { p, rootX, W };
    });
    let mn = 1e9, mx = -1e9;
    kf.forEach((k) => { for (const n in k.W) { mn = Math.min(mn, k.W[n][0]); mx = Math.max(mx, k.W[n][0]); } });
    const shift = CX - (mn + mx) / 2;
    kf.forEach((k) => { k.rootX += shift; for (const n in k.W) k.W[n][0] += shift; });
    return (cache[id] = { id, a, kf, fy, W0: kf[0].W });
  }

/* Ритм — все данные с часов через Health Connect (только в приложении для Android, APK).
   Цепочка: часы Huawei → Huawei Health → приложение Health Sync → Health Connect → «Ритм».
   Читаем за последние 30 дней: шаги, расстояние, калории, пульс (средний/мин/макс), пульс в покое,

(function () {

    busy: false

  async function safe(p) { try { return await p; } catch (e) { console.warn('Health Connect:', e && e.message); return null; } }

    const H = plugin(); if (!H || ws.busy) return null;
    ws.busy = true;

    const range = { startDate: iso(start), endDate: iso(end) };
    const agg = (dataType, aggregation) => safe(H.queryAggregated(Object.assign({ dataType, bucket: 'day', aggregation }, range)));
    const read = (dataType, limit) => safe(H.readSamples(Object.assign({ dataType, limit: limit || 500 }, range)));
    const got = {};
    const W = (k) => { const d = store.day(k); return d.watch || (d.watch = {}); };

        agg('steps', 'sum'), agg('distance', 'sum'), agg('totalCalories', 'sum'), agg('calories', 'sum'), agg('heartRate', ['average', 'min', 'max']),
        read('restingHeartRate', 200), read('sleep', 120), read('weight', 120), agg('oxygenSaturation', 'average'), read('bloodPressure', 200)]);
      (steps && steps.samples || []).forEach((s) => { if (s.value > 0) { store.day(dayOf(s.startDate)).steps = Math.round(s.value); got.steps = 1; } });
      (dist && dist.samples || []).forEach((s) => { if (s.value > 0) { W(dayOf(s.startDate)).km = +(s.value / 1000).toFixed(2); got.dist = 1; } });
      (kcal && kcal.samples || []).forEach((s) => { if (s.value > 0) { W(dayOf(s.startDate)).kcal = Math.round(s.value); got.kcal = 1; } });
      (akcal && akcal.samples || []).forEach((s) => { if (s.value > 0) { W(dayOf(s.startDate)).active = Math.round(s.value); got.kcal = 1; } });
      (hr && hr.samples || []).forEach((s) => { const v = s.values || {}; if (v.average) { const w = W(dayOf(s.startDate)); w.hrAvg = Math.round(v.average); w.hrMin = Math.round(v.min || 0) || null; w.hrMax = Math.round(v.max || 0) || null; got.hr = 1; } });
      (rest && rest.samples || []).forEach((s) => { W(dayOf(s.startDate)).rest = Math.round(s.value); got.rest = 1; });
      (spo2 && spo2.samples || []).forEach((s) => { if (s.value > 0) { W(dayOf(s.startDate)).spo2 = Math.round(s.value); got.spo2 = 1; } });
      // сон: сессия относится к дню пробуждения; считаем только время сна, без бодрствования
      const sleepBy = {};

        const k = dayOf(s.endDate), x = sleepBy[k] || (sleepBy[k] = { min: 0, deep: 0, light: 0, rem: 0, awake: 0 });
        if (s.stages && s.stages.length) s.stages.forEach((g) => { if (g.stage === 'awake' || g.stage === 'inBed') x.awake += g.durationMinutes; else { x.min += g.durationMinutes; if (x[g.stage] != null) x[g.stage] += g.durationMinutes; } });

      });

    } finally { ws.busy = false; }
  };

  const auto = () => { const s = ws.state(); if (ws.native() && s.enabled && Date.now() - (s.at || 0) > 15 * 60e3) ws.sync().catch(() => {}); };

  /* ---------- блок «Данные с часов» для экрана «Часы» ---------- */

      const run = async (fn) => {

        ws.native() ? (s.enabled ? btn(ws.busy ? 'Обновляю…' : 'Обновить сейчас', 'refresh', () => run(ws.sync), 'tinted') : btn('Подключить Health Connect', 'heart', () => run(ws.connect))) : null,
        h('div', { class: 'card' }, h('ol', { class: 'coach-steps' },
          h('li', null, 'Установите из Google Play приложение Health Sync (от Appyhapps). Оно бесплатно на пробный период, дальше — платно.'),
          h('li', null, 'В Health Sync выберите источник «Huawei Health» и войдите в свой аккаунт Huawei, а назначение — «Health Connect».'),
          h('li', null, 'Включите синхронизацию шагов, сна, пульса, веса и кислорода.'),
          h('li', null, 'Здесь нажмите «Подключить Health Connect» и разрешите чтение данных.'))),

/* Ритм — проверка техники камерой.
   Поза распознаётся прямо на телефоне (MediaPipe Pose Landmarker, файлы лежат в vendor/mediapipe):
   видео никуда не отправляется. По суставам считаются углы, повторы и типичные ошибки,
   подсказки показываются на экране и произносятся голосом. */
(function () {
  'use strict';
  const App = window.App, { h, icon, sheet, toast, haptic, kidsSet, kidsAdd } = App, ui = App.ui;

  const available = () => !(window.claude && window.claude.use) && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext;

  /* ---------- геометрия ---------- */
  const IDX = { nose: 0, sh: [11, 12], el: [13, 14], wr: [15, 16], hip: [23, 24], kn: [25, 26], an: [27, 28], ft: [31, 32] };
  const ang = (a, b, c) => {   // угол abc в градусах
    const v1 = [a.x - b.x, a.y - b.y], v2 = [c.x - b.x, c.y - b.y];
    const d = Math.hypot(v1[0], v1[1]) * Math.hypot(v2[0], v2[1]) || 1;
    return Math.acos(Math.max(-1, Math.min(1, (v1[0] * v2[0] + v1[1] * v2[1]) / d))) * 180 / Math.PI;
  };
  const fromVert = (a, b) => Math.atan2(Math.abs(b.x - a.x), Math.abs(b.y - a.y)) * 180 / Math.PI;   // наклон отрезка от вертикали
  function frame(lm, W, H) {
    const P = lm.map((p) => ({ x: p.x * W, y: p.y * H, v: p.visibility == null ? 1 : p.visibility }));
    const vis = (s) => ['sh', 'hip', 'kn', 'an'].reduce((a, k) => a + P[IDX[k][s]].v, 0);
    const s = vis(0) >= vis(1) ? 0 : 1;   // сторона, лучше видная камере
    const j = (k, side) => P[IDX[k][side == null ? s : side]];
    const both = (k) => P[IDX[k][0]].v > 0.6 && P[IDX[k][1]].v > 0.6;
    return { P, j, both, s };
  }

  const hipOff = (F) => { const a = F.j('sh'), b = F.j('an'), m = F.j('hip'); const k = (m.x - a.x) / ((b.x - a.x) || 1); return m.y - (a.y + (b.y - a.y) * k); };

  /* ---------- правила по упражнениям ----------
     metric — главный угол; повтор: опускание ниже down и возврат выше up (или наоборот при inv);
     rep(min,max,F) — проверка после повтора; live(F,m) — проверка в каждом кадре; need — какие суставы должны быть видны. */
  const knee = (F) => ang(F.j('hip'), F.j('kn'), F.j('an'));
  const elbow = (F) => ang(F.j('sh'), F.j('el'), F.j('wr'));
  const line = (F) => ang(F.j('sh'), F.j('hip'), F.j('an'));
  const lean = (F) => fromVert(F.j('hip'), F.j('sh'));
  const bodyLine = (F) => { if (line(F) > 160) return null; return hipOff(F) > 0 ? 'Не провисайте в пояснице — подтяните живот' : 'Опустите таз — тело в одну линию'; };
  const RULES = {
    squat: { view: 'Встаньте боком к камере, всё тело в кадре', need: ['hip', 'kn', 'an', 'sh'], metric: knee, down: 120, up: 160,
      rep: (mn) => (mn > 105 ? 'Присядьте глубже — бёдра до параллели с полом' : null),
      live: (F, m) => {
        if (m < 135 && lean(F) > 52) return 'Грудь выше — не заваливайтесь вперёд';
        if (m < 140 && F.both('kn') && F.both('an')) { const kd = Math.abs(F.P[25].x - F.P[26].x), ad = Math.abs(F.P[27].x - F.P[28].x); if (ad > 20 && kd < ad * 0.75) return 'Колени наружу — по линии носков'; }
        return null;
      } },
    lunge: { view: 'Встаньте боком к камере', need: ['hip', 'kn', 'an', 'sh'], metric: (F) => Math.min(ang(F.j('hip', 0), F.j('kn', 0), F.j('an', 0)), ang(F.j('hip', 1), F.j('kn', 1), F.j('an', 1))), down: 125, up: 160,

/* Ритм — облачная копия для версии на claude.ai.
   Данные лежат в личном разделе зрителя (data/users/<id>/…): его не видит никто, включая владельца страницы.
   Стратегия простая: при открытии берём более свежую версию (устройство или облако), дальше дописываем изменения. */

    Object.keys(months).forEach((m) => { out['days-' + m] = JSON.stringify(months[m]); });
    out.meta = JSON.stringify({ v: 1, updatedAt: s.updatedAt || 0 });   // meta пишется последним
    return out;
  }
  function unpack(docs) {
    const s = { days: {} };
    Object.keys(docs).forEach((k) => {
      let v; try { v = JSON.parse(docs[k]); } catch (e) { return; }
      if (k.indexOf('days-') === 0) Object.assign(s.days, v || {});
      else if (k === 'meta') s.updatedAt = (v && v.updatedAt) || 0;
      else if (SIMPLE.indexOf(k) >= 0 && v !== null) s[k] = v;
    });
    return s;
  }
  async function pull() {
    const snap = await col.get(), docs = {};
    snap.docs.forEach((d) => { const b = d.data(); if (b && typeof b.json === 'string') docs[d.id] = b.json; });
    return docs;
  }
  async function push() {
    if (!col || store.state.demo) return;
    if (busy) { again = true; return; }
    busy = true;
    try {
      const docs = pack(store.state);
      for (const k of Object.keys(docs)) {
        if (known[k] === docs[k]) continue;
        if (docs[k].length > 230000) { console.warn('Ритм: раздел слишком большой для облачной копии:', k); continue; }
        await col.doc(k).set({ json: docs[k] });
        known[k] = docs[k];
      }
      for (const k of Object.keys(known)) if (k.indexOf('days-') === 0 && !(k in docs)) { await col.doc(k).delete(); delete known[k]; }
    } catch (e) { console.warn('Ритм: облачная копия не записалась', e && e.code); }
    busy = false;
    if (again) { again = false; push(); }
  }
  function adopt(docs) {
    const s = unpack(docs), at = s.updatedAt || 0;
    applying = true;
    App.memo = {};
    store.replace(s); store.state.updatedAt = at; store.save();
    applying = false;
    known = Object.assign({}, docs);
    if (App.ui.closeOnboarding) { App.ui.closeOnboarding(); App.ui.closeOnboarding = null; }
    App.go(App.currentTab() || 'today', { keep: true });
  }
  const hasProfile = (docs) => !!docs.profile && docs.profile !== 'null';
  const metaAt = (docs) => { try { return JSON.parse(docs.meta).updatedAt || 0; } catch (e) { return 0; } };

  (async () => {
    try {
      const got = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!got[0] || !got[1]) return;
      const id = await got[1].id(); if (!id) return;
      col = got[0].collection('data/users/' + id);
      const docs = await pull(), local = store.state;
      known = Object.assign({}, docs);
      App.sync.active = () => true;
      if (hasProfile(docs) && (!local.profile || local.demo || metaAt(docs) > (local.updatedAt || 0))) { adopt(docs); App.toast('Данные загружены из вашей копии', { icon: 'refresh', color: 'var(--teal)' }); }
      else if (local.profile) push();
      store.subs.add(() => { if (applying) return; clearTimeout(timer); timer = setTimeout(push, 1200); });
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'hidden') { clearTimeout(timer); push(); return; }
        try {   // вернулись на страницу: вдруг данные обновились с другого устройства
          const m = await col.doc('meta').get(), b = m.exists ? m.data() : null;
          const at = b && typeof b.json === 'string' ? (JSON.parse(b.json).updatedAt || 0) : 0;
          if (at > (store.state.updatedAt || 0) + 1500 && !busy) { const fresh = await pull(); if (hasProfile(fresh)) adopt(fresh); }
        } catch (e) {}
      });
    } catch (e) { console.warn('Ритм: облачная копия недоступна', e && e.code); }
  })();
})();

/* Ритм — запуск. */
(function () {
  'use strict';
  const App = window.App;
  App.store.load();
  App.mount();
  const s = App.store.state;
  if (s.profile && s.targets) App.go('today');
  else App.ui.onboarding();

  // автономная PWA: офлайн-кэш оболочки (на claude.ai сервис-воркеры недоступны)
  const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!native && !(window.claude && window.claude.use) && 'serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();

</script>
